services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - '${DB_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-root}']
      interval: 3s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    # `pnpm seed` is deferred to the task that adds db/seeds/products.seed.ts;
    # wiring it back in belongs to that task's diff, not this one.
    command: pnpm migrate
    environment: &app-env
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ecommerce}
      DB_USER: ${DB_USER:-products}
      DB_PASSWORD: ${DB_PASSWORD:-products}
      DB_POOL_MAX: ${DB_POOL_MAX:-25}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build: .
    environment: *app-env
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  mysql-data:
